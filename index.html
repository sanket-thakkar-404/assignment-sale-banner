    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="banner">
      <div class="left-section">
        <div class="stock">
          <div class="sale-badge"><i class="ri-time-line time"></i> Limited Time Sale!</div>
          <div class="sale-logo">
            <h2 class="discount-number">10<span class="">%</span>OFF</h2>
          </div>
          <div class="urgency-slogan">
            Hurry! Ayurvedic Wellness Products at Unbeatable Prices!
          </div>
          <div class="coupon-box" id="couponBox">
            Coupon Code: <span id="couponText">AYUR10</span>
          </div>
          <div class="countdown" id="countdown">00:00:00</div>
          <div class="orders-remaining">
            Orders Remaining: <span id="orders">500</span>
          </div>
        </div>
        <div class="out-stock" id="hidden">
          <div class="sale-badge ended">Sale Ended</div>

          <h2 class="discount-number ended-text">0% OFF</h2>

          <div class="urgency-slogan ended-slogan">
            This Offer is No Longer Available
          </div>

          <div class="coupon-box disabled">Coupon Expired</div>

          <div class="countdown ended-timer">00:00:00</div>

          <div class="orders-remaining soldout">Out of Stock</div>

          <button class="notify-btn">Notify Me</button>
        </div>
        <div id="livePopup" class="popup hidden"></div>
      </div>

      <div class="right-section">
        <div class="chart-container">
          <canvas id="analyticsChart"></canvas>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
